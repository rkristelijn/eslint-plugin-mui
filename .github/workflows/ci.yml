# CI gate: format, lint, tests, annotrace (--strict) on every supported Node,
# plus keur on the whole tree.
# @implements ADR-005.gate
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  keur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # keur check gates the staged set; stage the whole tree as new so the
      # gate sees every file (same verdict as a local commit of all files).
      - name: Stage the whole tree for keur
        run: git read-tree --empty && git add -A
      - uses: rkristelijn/keur@ade05b4d9537b538acefb966ba83b86a1f206891 # v0.2.0
        with:
          version: v0.2.0
          args: check --tier pre-push
